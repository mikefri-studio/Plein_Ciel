name: Tests de Régression Plein Ciel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Installer les dépendances NPM
      run: npm ci

    - name: Installer les navigateurs et dépendances système Playwright
      run: npx playwright install --with-deps

    - name: Lancer les tests Playwright
      run: npx playwright test
      env:
        CI: true

    - name: Sauvegarder le rapport de test (si échec)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 15
